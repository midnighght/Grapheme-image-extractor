<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extractor de grafemas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="title">Extractor de grafemas</h1>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section>
      <h2 data-i18n="step1">1. Sube tu imagen escaneada y recortada</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/png,image/jpeg,image/jpg">
        <span data-i18n="drop">Elije una imagen y suéltala aquí (PNG o JPEG, por lo menos de 1472×2152 px)</span>
      </label>
      <div class="template-note" id="templateNote">
        <span data-i18n="tplBefore">¿No tienes la plantilla? Descárgala </span><a id="templateLink" href="#" target="_blank" rel="noopener" data-i18n="tplLink">aquí</a><span data-i18n="tplAfter">.</span>
      </div>
      <p id="msg" role="status"></p>
    </section>

    <section id="thresholdSection" hidden>
      <h2 data-i18n="step2">2. Ajusta el umbral</h2>
      <p class="hint" data-i18n="hint">Baja o sube el deslizador hasta que las guías desaparezcan, y los grafemas permanezcan sólidos y legibles.</p>
      <div class="slider">
        <input type="range" id="threshold" min="0" max="255" value="128">
        <output id="thresholdValue">128</output>
      </div>
      <canvas id="preview"></canvas>
      <button id="go" type="button">Generar imágenes</button>
    </section>

    <section id="resultSection" hidden>
      <h2 data-i18n="step3">3. Imágenes generadas</h2>
      <button id="download" type="button" data-i18n="download">Descargar ZIP</button>
      <div id="thumbs"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
